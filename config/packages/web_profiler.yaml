when@dev:
    web_profiler:
        toolbar: true

    framework:
        profiler:
            # ZedPOS n'utilise pas le composant Serializer : cette collecte
            # n'apportait rien et alourdissait chaque requête.
            collect_serializer_data: false

when@test:
    framework:
        profiler:
            collect: false
            collect_serializer_data: true
