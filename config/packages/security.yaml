security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Hiérarchie des rôles : DIRIGEANTE > GERANT > CAISSIER.
    # COMPTABLE est un rôle autonome (connexion classique, accès comptabilité).
    role_hierarchy:
        ROLE_GERANT: [ROLE_CAISSIER]
        ROLE_DIRIGEANTE: [ROLE_GERANT]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Connexion rapide caissier par code PIN (pavé numérique /caisse/login).
            custom_authenticators:
                - App\Security\CaisseAuthenticator

            # Connexion classique email / mot de passe (dirigeante, gérant, comptable).
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\RoleRedirectionHandler

            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/caisse/login$, roles: PUBLIC_ACCESS }
        - { path: ^/caisse, roles: ROLE_CAISSIER }
        - { path: ^/admin, roles: ROLE_GERANT }
        - { path: ^/pilotage, roles: ROLE_DIRIGEANTE }
        - { path: ^/comptabilite, roles: ROLE_COMPTABLE }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
