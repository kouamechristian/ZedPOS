security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Hiérarchie des rôles : DIRIGEANTE > GERANT > CAISSIER.
    # COMPTABLE est un rôle autonome (connexion classique, accès comptabilité).
    role_hierarchy:
        ROLE_GERANT: [ROLE_CAISSIER]
        ROLE_DIRIGEANTE: [ROLE_GERANT]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Connexion rapide caissier par code PIN (pavé numérique /caisse/login).
            custom_authenticators:
                - App\Security\CaisseAuthenticator

            # Connexion classique email / mot de passe (dirigeante, gérant, comptable).
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\RoleRedirectionHandler

            # Cinq essais par quart d'heure et par couple (identifiant, IP), plus
            # un plafond global par IP seule que Symfony pose de lui-même. Un
            # succès remet le compteur à zéro : celui qui se connaît n'est jamais
            # gêné, celui qui essaie des mots de passe l'est tout de suite.
            #
            # ⚠ Ceci ne couvre que `/login`. La connexion au pavé numérique lui
            # échappe pour deux raisons, et c'est `CaisseAuthenticator` qui s'en
            # charge — voir le limiteur `connexion_caisse` :
            #
            #   - le compteur est indexé sur l'identifiant saisi, or un code PIN
            #     n'en porte aucun : quatre chiffres, et rien d'autre ;
            #   - le contrôle de Symfony s'accroche à `CheckPassportEvent`, qui
            #     n'est émis qu'une fois le passeport construit. Sur un PIN
            #     inconnu, l'authentificateur lève avant d'en construire un :
            #     l'événement ne part jamais, et pas un seul échec ne serait
            #     compté. La porte la plus exposée — 10 000 combinaisons — serait
            #     restée la seule sans serrure.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/caisse/login$, roles: PUBLIC_ACCESS }
        # Amorçage du premier compte : publique par nécessité — sur une base
        # vierge, il n'existe personne pour s'authentifier. Le contrôleur la
        # referme (404) dès qu'un compte existe, sans quoi n'importe qui
        # s'ouvrirait un accès dirigeante à tout moment.
        - { path: ^/installation$, roles: PUBLIC_ACCESS }
        # L'API d'encaissement exige au minimum un caissier. L'annulation est
        # arbitrée plus finement par VenteVoter, au niveau du contrôleur : gérant
        # sans restriction, caissier sur le seul ticket qu'il vient d'encaisser.
        - { path: ^/api, roles: ROLE_CAISSIER }
        - { path: ^/caisse, roles: ROLE_CAISSIER }
        - { path: ^/admin, roles: ROLE_GERANT }
        - { path: ^/pilotage, roles: ROLE_DIRIGEANTE }
        # ROLE_COMPTABLE reste autonome : il n'est dans la hiérarchie d'aucun
        # autre rôle, il doit donc être nommé ici. ROLE_GERANT couvre du même
        # coup la dirigeante, qui en hérite.
        - { path: ^/comptabilite, roles: [ROLE_COMPTABLE, ROLE_GERANT] }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
