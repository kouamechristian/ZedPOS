# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Seuil d'alerte de marge, en points de base (6000 = 60 %).
    app.seuil_marge_bp: 6000

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Contournement de l'introspection MariaDB 10.4 (voir src/Doctrine/DBAL).
    App\Doctrine\DBAL\MariaDbCompatMiddleware:
        tags: ['doctrine.middleware']

    # Seuil de marge paramétrable pour le calculateur de coût.
    App\Service\CalculateurCoutMatiere:
        arguments:
            $seuilMargeParDefautBp: '%app.seuil_marge_bp%'

    # Les informations de la boutique viennent de la table `parametre`
    # (back-office : /admin/parametres), plus des variables d'environnement.
    App\Service\ParametresTicket:
        factory: ['@App\Service\ParametresBoutique', 'pourTicket']

    # Images des touches produits. Sous `public/` : elles sont servies en statique
    # par le serveur web, sans passer par PHP — la grille de caisse en charge une
    # par touche, il n'y a pas de raison d'amorcer le noyau pour chacune.
    App\Service\ImageArticle:
        arguments:
            $repertoire: '%kernel.project_dir%/public/uploads/articles'

    # Logo de l'établissement. Répertoire distinct de celui des articles : ce n'est
    # pas une photo de touche, et le mélanger aux images du catalogue rendrait une
    # sauvegarde ou un nettoyage impossibles à trier.
    App\Service\LogoBoutique:
        arguments:
            $repertoire: '%kernel.project_dir%/public/uploads/boutique'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Les tests écrivent de vrais fichiers : ailleurs que dans `public/`, pour
        # qu'ils ne se mélangent pas aux images de la boutique et disparaissent
        # avec le cache.
        App\Service\ImageArticle:
            arguments:
                $repertoire: '%kernel.cache_dir%/images-articles'

        App\Service\LogoBoutique:
            arguments:
                $repertoire: '%kernel.cache_dir%/logo-boutique'

        # Les compteurs de tentatives de connexion vivent dans un cache sur
        # disque, qui survit d'un test à l'autre : un test qui échoue à se
        # connecter laisserait sinon sa dette au suivant, et l'ordre d'exécution
        # déciderait du résultat. L'alias rend le pool accessible pour le vider.
        test.cache.rate_limiter:
            alias: cache.rate_limiter
            public: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
